id: r-chop-cyclophosphamide-thrombocytopenia

title: R-CHOP Cyclophosphamide Dose Modifications for Thrombocytopenia


# ----------------------------------------------------------------------------
# Regimen and Medication
# ----------------------------------------------------------------------------

regimen: r-chop

medication: cyclophosphamide


# ----------------------------------------------------------------------------
# Toxicity Actions
# ----------------------------------------------------------------------------

toxicity:

  - toxicity: thrombocytopenia

    grades:

      - grade: Grade 3

        actions:

          - action: Assess clinical status and platelet count recovery before next cycle.

          - action: Consider treatment delay or dose adjustment according to protocol and clinical circumstances.


      - grade: Grade 4

        actions:

          - action: Hold treatment until platelet count recovery.

          - action: Consider dose reduction or protocol modification if recurrent.


