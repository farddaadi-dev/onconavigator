# ----------------------------------------------------------------------------
# Safety
# ----------------------------------------------------------------------------

safety:

  contraindications: []

  warnings:
    - Myelosuppression.
    - Hemorrhagic cystitis and other urothelial toxicity.
    - Serious infections.
    - Infertility and gonadal toxicity.
    - Secondary malignancies.

  commonAdverseEffects:
    - Myelosuppression.
    - Nausea and vomiting.
    - Alopecia.
    - Fatigue.

  seriousAdverseEffects:
    - Hemorrhagic cystitis.
    - Severe myelosuppression.
    - Serious infection.
    - Secondary malignancy.


