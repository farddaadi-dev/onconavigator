# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

id: doxorubicin

title: Doxorubicin

aliases:
  - Adriamycin


# ----------------------------------------------------------------------------
# Classification
# ----------------------------------------------------------------------------

classification:

  class: chemotherapy

  subclass: anthracycline

  molecularTargets: []


# ----------------------------------------------------------------------------
# Indications
# ----------------------------------------------------------------------------

indications:

  diseases:
    - dlbcl

  usedInRegimens:
    - r-chop


# ----------------------------------------------------------------------------
# Dosage Forms
# ----------------------------------------------------------------------------

dosageForms:

  - formulation: solution for injection or infusion

    strengths: []


# ----------------------------------------------------------------------------
# Administration
# ----------------------------------------------------------------------------

administration:

  routes:
    - IV

  preparation:
    - Prepare and administer according to the applicable product monograph and institutional protocol.

  infusion:
    - Administer intravenously according to institutional protocol.
    - Ensure appropriate administration technique because extravasation can cause severe tissue injury.

  premedications: []

  specialInstructions:
    - Verify cumulative anthracycline exposure before administration.
    - Assess cardiac function when clinically indicated.


# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  baseline:
    - Complete blood count
    - Renal function
    - Hepatic function
    - Assessment of cardiac function when clinically indicated
    - Review cumulative anthracycline exposure

  duringTreatment:
    - Complete blood count
    - Hepatic function
    - Signs and symptoms of infection
    - Extravasation during administration
    - Clinical evidence of cardiac toxicity

  longTerm:
    - Cumulative anthracycline exposure
    - Cardiac function when clinically indicated
    - Risk of treatment-related cardiomyopathy


# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications:

  renalImpairment: []

  hepaticImpairment:
    - Dose modification may be required according to hepatic function and the applicable product monograph or treatment protocol.

  hematologicToxicity:
    - Delay or modify treatment according to the treatment protocol and severity of hematologic toxicity.

  neurologicToxicity: []

  cardiacToxicity:
    - Consider treatment modification or discontinuation in clinically significant cardiac dysfunction.
    - Refer to the applicable product monograph and treatment protocol for specific recommendations.

  infusionReaction: []

  other:
    - Consider cumulative lifetime anthracycline exposure when determining treatment eligibility and dosing.


# ----------------------------------------------------------------------------
# Safety
# ----------------------------------------------------------------------------

safety:

  contraindications: []

  warnings:
    - Dose-dependent cardiotoxicity.
    - Extravasation can cause severe local tissue injury.
    - Myelosuppression.
    - Secondary malignancies.
    - Severe tissue injury may occur with incorrect administration.

  commonAdverseEffects:
    - Myelosuppression.
    - Alopecia.
    - Nausea and vomiting.
    - Fatigue.
    - Mucositis.

  seriousAdverseEffects:
    - Cardiomyopathy and congestive heart failure.
    - Severe myelosuppression.
    - Severe extravasation injury.
    - Secondary malignancy.


# ----------------------------------------------------------------------------
# Supportive Care
# ----------------------------------------------------------------------------

supportiveCare:

  topics:
    - antiemetic-prophylaxis


