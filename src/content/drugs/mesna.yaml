id: mesna

title: Mesna

aliases:
  - 2-mercaptoethane sulfonate

# ----------------------------------------------------------------------------
# Classification
# ----------------------------------------------------------------------------

classification:

  class: supportive-care

  subclass: uroprotective-agent

  molecularTargets: []

# ----------------------------------------------------------------------------
# Indications
# ----------------------------------------------------------------------------

indications:

  diseases:
    - burkitt-lymphoma

  usedInRegimens:
    - r-ivac-high-risk

# ----------------------------------------------------------------------------
# Dosage Forms
# ----------------------------------------------------------------------------

dosageForms:

  - formulation: solution for injection or infusion

    strengths: []

# ----------------------------------------------------------------------------
# Administration
# ----------------------------------------------------------------------------

administration:

  routes:
    - IV

  preparation:
    - Prepare and administer according to the applicable product monograph and institutional protocol.

  infusion:
    - Administer according to the timing and dosing schedule specified by the ifosfamide-containing treatment protocol.

  premedications: []

  specialInstructions:
    - Administer with ifosfamide according to the applicable uroprotection protocol.
    - Maintain adequate hydration according to the treatment protocol.
    - Mesna does not replace adequate hydration or appropriate monitoring for urinary toxicity.

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  baseline:
    - Renal function
    - Assessment for urinary tract toxicity

  duringTreatment:
    - Fluid balance
    - Urinalysis or assessment for hematuria according to protocol
    - Signs and symptoms of urinary tract toxicity
    - Treatment-related adverse effects

  longTerm: []

# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications:

  renalImpairment: []

  hepaticImpairment: []

  hematologicToxicity: []

  neurologicToxicity: []

  cardiacToxicity: []

  infusionReaction:
    - Manage clinically significant hypersensitivity or infusion reactions according to institutional protocol.

  other:
    - Adjust mesna administration according to the applicable ifosfamide-containing treatment protocol.

# ----------------------------------------------------------------------------
# Safety
# ----------------------------------------------------------------------------

safety:

  contraindications: []

  warnings:
    - Mesna is used as uroprotection during ifosfamide therapy and does not eliminate the need for adequate hydration and monitoring for hematuria.
    - Hypersensitivity reactions may occur.

  commonAdverseEffects:
    - Nausea
    - Headache
    - Fatigue

  seriousAdverseEffects:
    - Serious hypersensitivity reactions

