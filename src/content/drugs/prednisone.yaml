# ----------------------------------------------------------------------------
# Safety
# ----------------------------------------------------------------------------

safety:

  contraindications: []

  warnings:
    - May increase susceptibility to infection.
    - May cause hyperglycemia.
    - May cause hypertension and fluid retention.
    - May cause mood and sleep disturbances.
    - Prolonged exposure may cause adrenal suppression and other corticosteroid-related complications.

  commonAdverseEffects:
    - Increased appetite.
    - Insomnia.
    - Mood changes.
    - Dyspepsia.
    - Hyperglycemia.

  seriousAdverseEffects:
    - Serious infection.
    - Severe hyperglycemia.
    - Psychiatric adverse effects.
    - Adrenal suppression with prolonged exposure.


