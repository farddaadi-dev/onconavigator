id: ac-dose-dense
title: Dose Dense AC
type: standalone
description: Doxorubicin plus Cyclophosphamide biweekly
aliases: []

diseases:
  - breast-cancer

treatmentIntent: 
  - curative
  
setting:
  - adjuvant
  - neoadjuvant
lineOfTherapy: 
  - first-line

biomarkers: []

eligibility: []

schedule:
  cycle:
    length:
      value: 14
      unit: days
  stopCondition:
    plannedCycles: 4
  treatmentPhases: []

preTreatmentAssessment:
  diagnosis:
    - Confirm breast cancer diagnosis and treatment indication.

  clinical:
    - Document ECOG performance status.
    - Record height and weight.
    - Assess baseline cardiac status before anthracycline therapy.

  laboratory:
    - Complete blood count (CBC).
    - Comprehensive metabolic panel (CMP).
    - HbsAg, HBc Ab, HBs Ab

  infectionScreening: []

  imaging:
    - EKG
    - Echocardiogram

  calculations:
    - Calculate body surface area (BSA).

  counselling:
    - Discuss treatment goals and potential adverse effects.
    - Discuss fertility preservation options if relevant.
    - Discuss the need for contraception during treatment and for a period after treatment completion.
    - Obtain informed consent.

  other: []

treatmentPreparation:
  premedications: []

  antiemeticRisk: high
    

  hydration: []

  prophylaxis: []

  other: []

medications:

  - drug: doxorubicin
    rules:
      - dose:
          value: 60
          unit: mg/m²
          type: bsa
        administration:
          route: IV
          administrationDays:
            - 1
          infusionDuration: 5–15 minutes
        condition:
          cycleRange:
            start: 1
            end: 4

  - drug: cyclophosphamide
    rules:
      - dose:
          value: 600
          unit: mg/m²
          type: bsa
        administration:
          route: IV
          administrationDays:
            - 1
          diluent: NS
          volume:
            value: 500
            unit: mL
          infusionDuration: 30–60 minutes
        condition:
          cycleRange:
            start: 1
            end: 4

  - drug: pegfilgrastim
    rules:
      - dose:
          value: 6
          unit: mg
          type: flat
        administration:
          route: SC
          administrationDays:
            - 2
        condition:
          cycleRange:
            start: 1
            end: 4

monitoring:
  beforeEachCycle:
    - Complete blood count (CBC).
    - Comprehensive metabolic panel (CMP).

  duringTreatment:
    - Monitor cumulative anthracycline exposure and cardiac toxicity.
    - Monitor for myelosuppression.

supportiveCare:
  - g-csf-support
  - febrile-neutropenia

doseModifications:
  - Modify treatment according to hematologic toxicity and applicable protocol.
  - Consider anthracycline dose modification or discontinuation according to cardiac function and cumulative exposure.
  - Refer to the applicable protocol and product information for drug-specific dose modification guidance.

references:
  - eviq-breast-ac-paclitaxel-4113

review:
  lastReviewed: 2026-08-12
  reviewedBy: farshid