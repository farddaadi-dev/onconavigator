# ----------------------------------------------------------------------------

eligibility:
  - Breast cancer for which sequential anthracycline and taxane-based chemotherapy is indicated.
  - Adequate hematologic, renal, and hepatic function according to protocol requirements.
  - No contraindication to anthracycline or paclitaxel therapy.

