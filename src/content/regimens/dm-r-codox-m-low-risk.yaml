# ============================================================================
# Low-risk dose-modified R-CODOX-M
#
# Rituximab + CODOX-M
# ============================================================================

# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

id: dm-r-codox-m-low-risk
title: DM-R-CODOX-M

aliases:
  - Rituximab-CODOX-M
  - Dose-modified R-CODOX-M

description: >-
  A dose-modified R-CODOX-M regimen for the treatment of low-risk Burkitt
  lymphoma, incorporating rituximab with cyclophosphamide, vincristine,
  doxorubicin, high-dose methotrexate, and intrathecal chemotherapy.

type: standalone

# ----------------------------------------------------------------------------
# Clinical Context
# ----------------------------------------------------------------------------

diseases:
  - burkitt-lymphoma

treatmentIntent:
  - curative

setting:
  - newly-diagnosed

lineOfTherapy:
  - first-line

biomarkers: []

# ----------------------------------------------------------------------------
# Eligibility
# ----------------------------------------------------------------------------

eligibility:
  - Low-risk Burkitt lymphoma according to applicable clinical criteria.
  - Age 75 years or younger according to the eviQ protocol.

# ----------------------------------------------------------------------------
# Schedule
# ----------------------------------------------------------------------------

schedule:

  cycle:
    length:
      value: 21
      unit: days

  stopCondition:
    plannedCycles: 3

treatmentPhases: []

# ----------------------------------------------------------------------------
# Pre-treatment Assessment
# ----------------------------------------------------------------------------

preTreatmentAssessment:

  diagnosis:
    - Confirm diagnosis of Burkitt lymphoma.
    - Confirm low-risk disease according to applicable clinical criteria.

  clinical:
    - Assess baseline performance status.
    - Assess for clinically significant infection before treatment.
    - Assess baseline neurological status before vincristine and intrathecal therapy.

  laboratory:
    - Complete blood count (CBC).
    - Renal function.
    - Hepatic function.
    - Serum electrolytes.
    - Serum uric acid.
    - LDH.

  infectionScreening:
    - Screen for hepatitis B infection before rituximab-containing therapy.

  imaging:
    - Perform baseline disease assessment according to the applicable Burkitt lymphoma protocol.

  calculations:
    - Calculate body surface area (BSA).
    - Calculate creatinine clearance or other renal function estimate required for methotrexate assessment.

  counselling:
    - Discuss treatment goals and intensive chemotherapy schedule.
    - Discuss potential treatment-related toxicities.
    - Discuss the need for frequent laboratory monitoring and supportive care.
    - Obtain informed consent.

  other:
    - Assess suitability for intensive multi-agent chemotherapy.
    - Assess suitability for intrathecal chemotherapy.

# ----------------------------------------------------------------------------
# Treatment Preparation
# ----------------------------------------------------------------------------

treatmentPreparation:

  premedications:
    - Paracetamol 1000 mg PO 60 minutes before rituximab.
    - Loratadine 10 mg PO 60 minutes before rituximab.
    - Hydrocortisone 100 mg IV 30 minutes before rituximab.
  antiemeticRisk: high

  hydration: []

  prophylaxis: []

  other: []

# ----------------------------------------------------------------------------
# Medications
# ----------------------------------------------------------------------------

medications:

  # --------------------------------------------------------------------------
  # Rituximab — Day 1
  # --------------------------------------------------------------------------

  - drug: rituximab
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 375
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
          diluent: NS
          volume:
            value: 500
            unit: mL
          notes: Administer according to the graded administration rate specified by the protocol.

  # --------------------------------------------------------------------------
  # Doxorubicin — Day 1
  # --------------------------------------------------------------------------

  - drug: doxorubicin
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 40
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
          infusionDuration: 5–15 minutes

  # --------------------------------------------------------------------------
  # Vincristine — Days 1 and 8
  # --------------------------------------------------------------------------

  - drug: vincristine
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 1.5
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
            - 8
          diluent: NS
          volume:
            value: 50
            unit: mL
          infusionDuration: 5–10 minutes
          notes: Cap dose at 2 mg. Administer via minibag.

  # --------------------------------------------------------------------------
  # Cyclophosphamide — Day 1
  # --------------------------------------------------------------------------

  - drug: cyclophosphamide
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 800
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
          diluent: NS
          volume:
            value: 500
            unit: mL
          infusionDuration: 30–60 minutes

  # --------------------------------------------------------------------------
  # Cyclophosphamide — Days 2–5
  # --------------------------------------------------------------------------

  - drug: cyclophosphamide
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 200
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 2
            - 3
            - 4
            - 5
          diluent: NS
          volume:
            value: 500
            unit: mL
          infusionDuration: 30–60 minutes

    # --------------------------------------------------------------------------
  # Rituximab — Day 11
  # --------------------------------------------------------------------------

  - drug: rituximab
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 375
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 11
          diluent: NS
          volume:
            value: 500
            unit: mL
          notes: Administer according to the graded administration rate specified by the protocol.

  # --------------------------------------------------------------------------
  # Intrathecal Cytarabine — Days 1 and 3
  # --------------------------------------------------------------------------

  - drug: cytarabine
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 70
          unit: mg
          type: flat

        administration:
          route: IT
          administrationDays:
            - 1
            - 3
          notes: Administer according to local institutional intrathecal policy.

  # --------------------------------------------------------------------------
  # Methotrexate — Day 10 — Initial infusion
  # --------------------------------------------------------------------------

  - drug: methotrexate
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 300
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 10
          diluent: NS
          volume:
            value: 500
            unit: mL
          infusionDuration: 60 minutes
          notes: Initial methotrexate infusion.

  # --------------------------------------------------------------------------
  # Methotrexate — Day 10 — 23-hour infusion
  # --------------------------------------------------------------------------

  - drug: methotrexate
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 2700
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 10
          diluent: NS
          volume:
            value: 1000
            unit: mL
          infusionDuration: 23 hours
          notes: Continuous infusion following the initial methotrexate infusion.

  # --------------------------------------------------------------------------
  # Leucovorin — Day 11 onward
  # --------------------------------------------------------------------------

  - drug: leucovorin
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 15
          unit: mg/m²
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 11
          notes: Start 36 hours after commencement of the methotrexate infusion. Administer every 3 hours from hours 36–48, then every 6 hours until serum methotrexate level is less than 0.1 micromol/L.

  # --------------------------------------------------------------------------
  # Intrathecal Methotrexate — Day 15
  # --------------------------------------------------------------------------

  - drug: methotrexate
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 12
          unit: mg
          type: flat

        administration:
          route: IT
          administrationDays:
            - 15
          notes: Administer according to local institutional intrathecal policy.

  # --------------------------------------------------------------------------
  # Leucovorin — Day 16
  # --------------------------------------------------------------------------

  - drug: leucovorin
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 15
          unit: mg
          type: flat

        administration:
          route: PO
          administrationDays:
            - 16
          notes: Administer once, 24 hours after intrathecal methotrexate.

  # --------------------------------------------------------------------------
  # Filgrastim — Day 13 onward
  # --------------------------------------------------------------------------

  - drug: filgrastim
    rules:
      - condition:
          cycleRange:
            start: 1
            end: 3

        dose:
          value: 5
          unit: micrograms/kg
          type: weight

        administration:
          route: SC
          administrationDays:
            - 13
          notes: Administer once daily starting on Day 13 and continue until ANC is greater than 1.0 × 10^9/L.

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  beforeEachCycle:
    - Complete blood count (CBC).
    - Ensure ANC is greater than 1.0 × 10⁹/L before commencing the next cycle.
    - Ensure platelet count is greater than 75 × 10⁹/L before commencing the next cycle.
    - Assess renal function before each cycle.
    - Assess hepatic function before each cycle.
    - Assess treatment-related toxicities.
    - Assess performance status and clinical fitness for intensive chemotherapy.
    - Assess for signs or symptoms of infection.
    - Assess neurological toxicity before vincristine and intrathecal chemotherapy.

  duringTreatment:
    - Monitor for rituximab infusion-related reactions.
    - Monitor for myelosuppression and febrile neutropenia.
    - Monitor renal function during high-dose methotrexate therapy.
    - Monitor serum methotrexate concentration according to protocol.
    - Continue leucovorin rescue according to methotrexate levels and protocol requirements.
    - Monitor for mucositis and gastrointestinal toxicity.
    - Monitor for hepatotoxicity.
    - Monitor for neurotoxicity.
    - Monitor for complications related to intrathecal chemotherapy.

# ----------------------------------------------------------------------------
# Supportive Care
# ----------------------------------------------------------------------------

supportiveCare:
  - g-csf-support
  - tumor-lysis-syndrome
  - antimicrobial-prophylaxis

# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications:
  - Modify treatment according to hematologic toxicity and applicable protocol.
  - Adjust or withhold methotrexate according to renal function, methotrexate clearance, and protocol requirements.
  - Modify vincristine according to treatment-related neurotoxicity.
  - Modify treatment according to significant hepatic or other organ toxicity.
  - Refer to the applicable protocol and product information for drug-specific dose modification guidance.

