# ----------------------------------------------------------------------------
# Schedule
# ----------------------------------------------------------------------------

schedule:

  cycle:
    length:
      value: 21
      unit: days

  stopCondition:
    plannedCycles: 4

  notes: >
    Four cycles in total, alternating high-risk dose-modified CNS Proven R-CODOX-M in
    cycles 1 and 3 with high-risk CNS Proven R-IVAC in cycles 2 and 4.

  treatmentPhases: []

