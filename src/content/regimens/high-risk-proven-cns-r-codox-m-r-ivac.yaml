id: high-risk-proven-cns-r-codox-m-r-ivac

title: High-Risk Proven CNS Disease R-CODOX-M/R-IVAC

description: >
  A four-cycle alternating treatment program for high-risk Burkitt lymphoma with proven CNS disease, consisting of two cycles of high-risk CNS disease dose-modified R-CODOX-M alternating with two cycles of high-risk CNS disease R-IVAC.

