# ============================================================================
# R-CHOP
#
# Rituximab + Cyclophosphamide + Doxorubicin + Vincristine + Prednisone
# ============================================================================

# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

id: r-chop

title: R-CHOP

aliases:
  - CHOP-R


# ----------------------------------------------------------------------------
# Clinical Context
# ----------------------------------------------------------------------------

diseases:
  - dlbcl

intent: curative

setting: Newly diagnosed

lineOfTherapy: first-line

biomarkers:
  - cd20


# ----------------------------------------------------------------------------
# Eligibility
# ----------------------------------------------------------------------------

eligibility:
  - Confirmed diagnosis of CD20-positive diffuse large B-cell lymphoma
  - Adequate bone marrow, renal, and hepatic function according to protocol requirements
  - No contraindication to anthracycline-based therapy


# ----------------------------------------------------------------------------
# Schedule
# ----------------------------------------------------------------------------

schedule:

  cycle:

    length:
      value: 21
      unit: days

  stopCondition:

    plannedCycles: 6

  treatmentPhases: []



# ----------------------------------------------------------------------------
# Pre-treatment Assessment
# ----------------------------------------------------------------------------

preTreatmentAssessment:

  diagnosis:
    - Confirm diagnosis of diffuse large B-cell lymphoma
    - Confirm CD20 positivity

  clinical:
    - Document ECOG performance status
    - Record height and weight

  laboratory:
    - Complete blood count (CBC)
    - Comprehensive metabolic panel (CMP)
    - Lactate dehydrogenase (LDH)
    - Uric acid

  infectionScreening:
    - Hepatitis B screening (HBsAg, anti-HBc, anti-HBs)

  imaging:
    - Assess baseline left ventricular function before anthracycline therapy according to clinical circumstances and protocol.

  calculations:
    - Calculate body surface area (BSA)

  counselling:
    - Discuss treatment goals and potential adverse effects
    - Obtain informed consent

  other: []


# ----------------------------------------------------------------------------
# Treatment Preparation
# ----------------------------------------------------------------------------

treatmentPreparation:

  premedications:
    - Acetaminophen before rituximab.
    - H1 antihistamine before rituximab.
    - Give Day 1 prednisone as part of premedication before rituximab.

  antiemetics:
    - Moderate antiemetic prophylaxis.

  hydration:
    - Assess hydration and tumor lysis syndrome risk before treatment.

  prophylaxis:
    - Screen for hepatitis B virus before starting treatment.
    - Assess need for hepatitis B antiviral prophylaxis according to HBV status.
    - Consider tumor lysis syndrome prophylaxis in patients with high-volume disease.
    - Primary G-CSF prophylaxis for neutropenia.

  other: []


# ----------------------------------------------------------------------------
# Medications
# ----------------------------------------------------------------------------

# Medications are listed in administration order.

medications:

  - drug: rituximab

    rules:

      - dose:
          value: 375
          unit: mg/m²
          type: bsa

        administration:
          route: IV

          administrationDays:
            - 1

          diluent: NS

          notes: >
            Dilute to a final concentration of 1–4 mg/mL.
            Administer by graduated infusion rate according to institutional
            rituximab infusion protocol; do not administer as an IV push or bolus.

        notes: >
          First infusion: initiate at 50 mg/hour and increase by 50 mg/hour
          every 30 minutes as tolerated, to a maximum of 400 mg/hour.
          Subsequent infusions may use the standard graduated rate or,
          when appropriate, a 90-minute rapid infusion.

    references:
      - nccn-b-cell-lymphomas


  - drug: cyclophosphamide

    rules:

      - dose:
          value: 750
          unit: mg/m²
          type: bsa

        administration:
          route: IV

          administrationDays:
            - 1

          diluent: NS

          volume:
            value: 250
            unit: mL

          infusionDuration: 1 hour

    references: []


  - drug: doxorubicin

    rules:
      - dose:
          value: 50
          unit: mg/m²
          type: bsa

        administration:
          route: IV

          administrationDays:
            - 1

          infusionDurarion: 10 minutes

          notes: IV Push

    monitoringNotes: >
      Monitor cumulative anthracycline exposure and cardiac function.

    references: []


  - drug: vincristine

    rules:
      - dose:
          value: 1.4
          unit: mg/m²
          type: bsa

        administration:
          route: IV

          administrationDays:
            - 1

          diluent: NS

          volume:
            value: 50
            unit: mL
          
          infusionDuration: 15 minutes


    comments: >
      Dose is commonly capped at 2 mg according to institutional policy.

    references: []


  - drug: prednisone

    rules:
      - dose:
          value: 100
          unit: mg
          type: flat

        administration:
          route: PO

          administrationDays:
            - 1
            - 2
            - 3
            - 4
            - 5
        notes: On Day 1, administer as part of premedication before rituximab.

    references: []

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  beforeEachCycle:
    - CBC
    - CMP
    - ECOG performance status
    - Assess treatment-related toxicities

  duringTreatment:
    - Monitor for rituximab infusion reactions
    - Assess for fever and signs of infection
    - Monitor for peripheral neuropathy
    - Monitor cumulative anthracycline dose and cardiac toxicity

# ----------------------------------------------------------------------------
# Supportive Care
# ----------------------------------------------------------------------------

supportiveCare: 
  - antiemetic-prophylaxis
  - g-csf-support
  - tumor-lysis-syndrome
  - hepatitis-b-reactivation


# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications:
  - Delay treatment when clinically indicated for significant hematologic toxicity.
  - Modify individual drug doses according to the specific toxicity and applicable drug or institutional protocol.
  - Refer to individual drug entries for drug-specific dose modification guidance.

# ----------------------------------------------------------------------------
# Follow-up
# ----------------------------------------------------------------------------

followUp:

  responseAssessment:
    - Assess treatment response with PET-CT according to lymphoma response criteria.

  postTreatmentEvaluation:
    - Perform end-of-treatment clinical and laboratory assessment as clinically indicated.

  surveillance:
    - Follow disease-specific surveillance recommendations.

  other: []


# ----------------------------------------------------------------------------
# References
# ----------------------------------------------------------------------------

references:
  - nccn-b-cell-lymphomas
  - esmo-dlbcl-guideline
  - r-chop-landmark-study

