# ============================================================================
# High-Risk R-IVAC
# ============================================================================

# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

id: r-ivac-high-risk

title: R-IVAC

description: >
  High-risk R-IVAC regimen for Burkitt lymphoma, consisting of rituximab,
  ifosfamide, etoposide, high-dose cytarabine, intrathecal methotrexate,
  and supportive mesna and leucovorin.

aliases:
  - High-Risk R-IVAC
  - Rituximab IVAC

# ----------------------------------------------------------------------------
# Type
# ----------------------------------------------------------------------------

type: standalone

# ----------------------------------------------------------------------------
# Clinical Context
# ----------------------------------------------------------------------------

diseases:
  - burkitt-lymphoma

treatmentIntent:
  - curative

setting:
  - newly-diagnosed

lineOfTherapy:
  - first-line

biomarkers: []

# ----------------------------------------------------------------------------
# Eligibility
# ----------------------------------------------------------------------------

eligibility:
  - High-risk Burkitt lymphoma according to applicable clinical criteria.
  - Used as cycles 2 and 4 in the high-risk alternating R-CODOX-M/R-IVAC pathway.

# ----------------------------------------------------------------------------
# Schedule
# ----------------------------------------------------------------------------

schedule:

  cycle:
    length:
      value: 21
      unit: days

  stopCondition:
    plannedCycles: 2

  notes: >
    This regimen corresponds to cycles 2 and 4 of the high-risk Burkitt
    lymphoma treatment pathway and alternates with high-risk dose-modified
    R-CODOX-M. The next cycle should not commence until unsupported ANC is
    greater than 1.0 x 10^9/L and unsupported platelets are greater than
    75 x 10^9/L.

# ----------------------------------------------------------------------------
# Medications
# ----------------------------------------------------------------------------

medications:

  # --------------------------------------------------------------------------
  # Cytarabine
  # --------------------------------------------------------------------------

  - drug: cytarabine

    rules:

      - dose:
          value: 2000
          unit: mg/m2
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
            - 2
          diluent: sodium chloride 0.9%
          volume:
            value: 500
            unit: mL
          infusionDuration: 3 hours twice daily, 12 hours apart

        notes: >
          Administer twice daily on Days 1 and 2, 12 hours apart, for a total
          of four doses.

    monitoringNotes: >
      Monitor for high-dose cytarabine neurotoxicity and ocular toxicity.

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

  # --------------------------------------------------------------------------
  # Etoposide
  # --------------------------------------------------------------------------

  - drug: etoposide

    rules:

      - dose:
          value: 60
          unit: mg/m2
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
            - 2
            - 3
            - 4
            - 5
          diluent: sodium chloride 0.9%
          volume:
            value: 500
            unit: mL
          infusionDuration: 30-60 minutes

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

  # --------------------------------------------------------------------------
  # Ifosfamide
  # --------------------------------------------------------------------------

  - drug: ifosfamide

    rules:

      - dose:
          value: 1500
          unit: mg/m2
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
            - 2
            - 3
            - 4
            - 5
          diluent: sodium chloride 0.9%
          volume:
            value: 1000
            unit: mL
          infusionDuration: 2 hours

        notes: >
          eviQ specifies a diluent volume of 500 to 1000 mL sodium chloride
          0.9%; 1000 mL is used here to represent the upper end of the
          protocol range.

    monitoringNotes: >
      Monitor for ifosfamide-associated neurotoxicity and hemorrhagic
      cystitis.

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

  # --------------------------------------------------------------------------
  # Mesna
  # --------------------------------------------------------------------------

  - drug: mesna

    rules:

      - dose:
          value: 360
          unit: mg/m2
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
          diluent: sodium chloride 0.9%
          volume:
            value: 250
            unit: mL
          infusionDuration: 15 minutes
          notes: >
            Loading dose administered 60 minutes before the first dose of
            ifosfamide.

      - dose:
          value: 1500
          unit: mg/m2
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 1
            - 2
            - 3
            - 4
            - 5
          diluent: sodium chloride 0.9%
          volume:
            value: 1000
            unit: mL
          infusionDuration: 24 hours

        notes: >
          Administer as continuous infusion for uroprotection during
          ifosfamide treatment.

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

  # --------------------------------------------------------------------------
  # Rituximab
  # --------------------------------------------------------------------------

  - drug: rituximab

    rules:

      - dose:
          value: 375
          unit: mg/m2
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 3
          diluent: sodium chloride 0.9%
          volume:
            value: 500
            unit: mL
          infusionDuration: graded administration rate
          notes: >
            Administer according to the graded administration rate specified
            by the protocol.

      - dose:
          value: 375
          unit: mg/m2
          type: bsa

        administration:
          route: IV
          administrationDays:
            - 7
          diluent: sodium chloride 0.9%
          volume:
            value: 500
            unit: mL
          infusionDuration: graded administration rate
          notes: >
            Administer according to the graded administration rate specified
            by the protocol.

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

  # --------------------------------------------------------------------------
  # Methotrexate
  # --------------------------------------------------------------------------

  - drug: methotrexate

    rules:

      - dose:
          value: 12
          unit: mg
          type: flat

        administration:
          route: IT
          administrationDays:
            - 5
          notes: >
            Administer according to local institutional intrathecal policy.
            Intrathecal treatment may be administered on another day at the
            discretion of the treating clinician.

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

  # --------------------------------------------------------------------------
  # Leucovorin
  # --------------------------------------------------------------------------

  - drug: leucovorin

    rules:

      - dose:
          value: 15
          unit: mg
          type: flat

        administration:
          route: PO
          administrationDays:
            - 6
          notes: >
            Administer once, 24 hours after intrathecal methotrexate.

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

  # --------------------------------------------------------------------------
  # Filgrastim
  # --------------------------------------------------------------------------

  - drug: filgrastim

    rules:

      - dose:
          value: 5
          unit: micrograms/kg
          type: weight

        administration:
          route: SC
          administrationDays:
            - 7
          notes: >
            Administer once daily starting on Day 7 and continue until ANC is
            greater than 1.0 x 10^9/L.

    references:
      - eviq-burkitt-high-risk-r-ivac-4490

# ----------------------------------------------------------------------------
# Pre-treatment Assessment
# ----------------------------------------------------------------------------

preTreatmentAssessment:

  diagnosis:
    - Confirm diagnosis of Burkitt lymphoma.
    - Confirm high-risk disease according to applicable clinical criteria.

  clinical:
    - Assess baseline performance status.
    - Assess for clinically significant infection before treatment.
    - Assess baseline neurological status before high-dose cytarabine and
      intrathecal therapy.
    - Assess baseline ocular status before high-dose cytarabine.

  laboratory:
    - Complete blood count (CBC).
    - Renal function.
    - Hepatic function.
    - Serum electrolytes.
    - Serum uric acid.
    - LDH.

  infectionScreening:
    - Screen for hepatitis B infection before rituximab-containing therapy.

  imaging:
    - Perform disease assessment according to the applicable Burkitt lymphoma
      protocol.

  calculations:
    - Calculate body surface area (BSA).
    - Assess renal function before ifosfamide and high-dose cytarabine.

  counselling:
    - Discuss treatment goals and intensive chemotherapy schedule.
    - Discuss potential treatment-related toxicities.
    - Discuss the need for frequent laboratory monitoring and supportive care.
    - Obtain informed consent.

  other: []

# ----------------------------------------------------------------------------
# Treatment Preparation
# ----------------------------------------------------------------------------

treatmentPreparation:

  premedications:
    - Paracetamol 1000 mg PO 60 minutes before rituximab.
    - Loratadine 10 mg PO 60 minutes before rituximab.
    - Hydrocortisone 100 mg IV 30 minutes before rituximab.

  antiemeticRisk: high

  hydration: []

  prophylaxis: []

  other:
    - Administer ocular prophylaxis according to institutional protocol during
      high-dose cytarabine treatment.

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  beforeEachCycle:
    - Complete blood count.
    - Renal function.
    - Hepatic function.
    - Assess treatment-related toxicities.
    - Confirm unsupported ANC is greater than 1.0 x 10^9/L.
    - Confirm unsupported platelet count is greater than 75 x 10^9/L.
    - Assess performance status and clinical fitness for intensive chemotherapy.
    - Assess for signs or symptoms of infection.
    - Assess neurological status before treatment.
    - Assess ocular toxicity from previous cytarabine exposure.

  duringTreatment:
    - Monitor for rituximab infusion-related reactions.
    - Monitor for myelosuppression and febrile neutropenia.
    - Monitor for high-dose cytarabine neurotoxicity.
    - Monitor for high-dose cytarabine ocular toxicity.
    - Monitor for ifosfamide neurotoxicity.
    - Monitor for hemorrhagic cystitis.
    - Monitor renal function and fluid balance.
    - Monitor for complications related to intrathecal chemotherapy.
    - Monitor for mucositis and gastrointestinal toxicity.
    - Monitor for hepatotoxicity.

# ----------------------------------------------------------------------------
# Supportive Care
# ----------------------------------------------------------------------------

supportiveCare:
  - g-csf-support
  - tumor-lysis-syndrome
  - febrile-neutropenia

# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications:
  - Refer to the applicable protocol for dose modification in patients older
    than 65 years.
  - Modify cytarabine according to hematologic, renal, neurologic, and other
    clinically significant toxicity.
  - Modify ifosfamide according to renal function and treatment-related
    neurotoxicity.
  - Modify treatment according to significant hepatic or other organ toxicity.
  - Refer to the applicable protocol and product information for drug-specific
    dose modification guidance.

# ----------------------------------------------------------------------------
# References
# ----------------------------------------------------------------------------

references:
  - eviq-burkitt-high-risk-r-ivac-4490
  - eviq-burkitt-dm-r-codox-m-r-ivac-overview

