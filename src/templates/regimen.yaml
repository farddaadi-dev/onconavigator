# ============================================================================
# Regimen Template
#
# Purpose:
# Structured representation of an oncology treatment regimen.
#
# Notes:
# - Use identifiers for linked entities.
# - Keep clinical statements traceable to references.
# - Empty lists are preferred over unsupported assumptions.
#
# ============================================================================


# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

id:

title:

aliases: []


# ----------------------------------------------------------------------------
# Clinical Context
# ----------------------------------------------------------------------------

# Related disease identifiers
diseases: []

# Examples:
# curative
# adjuvant
# neoadjuvant
# definitive
# maintenance
# palliative
intent:

# Clinical setting
setting:

# Examples:
# first-line
# second-line
# third-line
# later-line
lineOfTherapy:


# Biomarkers relevant to treatment selection
biomarkers: []


# ----------------------------------------------------------------------------
# Eligibility
# ----------------------------------------------------------------------------

eligibility: []


# ----------------------------------------------------------------------------
# Schedule
# ----------------------------------------------------------------------------

schedule:

  cycle:

    length:
      value:
      unit: days

  stopCondition:

    plannedCycles:

    duration:
      value:
      unit: weeks

    untilProgression:

    untilUnacceptableToxicity:

  treatmentPhases: []

  notes:


# ----------------------------------------------------------------------------
# Pre-treatment Assessment
# ----------------------------------------------------------------------------

preTreatmentAssessment:

  # Confirm diagnosis and required disease characteristics.
  diagnosis: []

  # Clinical evaluation before starting treatment.
  clinical: []

  # Baseline laboratory investigations.
  laboratory: []

  # Infection screening required before treatment.
  infectionScreening: []

  # Baseline imaging or functional studies.
  imaging: []

  # Required calculations (e.g., BSA).
  calculations: []

  # Patient education and consent.
  counselling: []

  # Other pre-treatment assessments.
  other: []


# ----------------------------------------------------------------------------
# Treatment Preparation
# ----------------------------------------------------------------------------

treatmentPreparation:

  # Medications administered immediately before chemotherapy.
  premedications: []

  # Antiemetic regimen.
  antiemetics: []

  # Hydration before or during treatment.
  hydration: []

  # Prophylactic measures (e.g., antiviral, TLS prophylaxis).
  prophylaxis: []

  # Other preparation steps.
  other: []

# ----------------------------------------------------------------------------
# Medications
# ----------------------------------------------------------------------------

# Medications should follow administration order.
#
# Each medication contains:
# - drug: linked drug identifier
# - rules: one or more dose/administration rules
#
# Administration fields:
# - route: IV, PO, SC, IM, or IT
# - administrationDays: treatment day(s)
# - diluent: optional
# - volume: optional
# - infusionDuration: optional
# - notes: optional
#
# Example structure:

medications:

  - drug: example-drug

    rules:

      - dose:
          value:
          unit:
          type:

        administration:
          route: IV
          administrationDays:
            - 1
          diluent:
          volume:
            value:
            unit:
          infusionDuration:
          notes:

        # Optional rule-specific notes
        notes:

    # Optional medication-level information
    preparationNotes:
    infusionNotes:
    monitoringNotes:
    comments:

    references: []

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  beforeEachCycle: []

  duringTreatment: []


# ----------------------------------------------------------------------------
# Supportive Care
# ----------------------------------------------------------------------------

# Use clinical-support identifiers when available.

supportiveCare: []


# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications: []


# ----------------------------------------------------------------------------
# Follow-up
# ----------------------------------------------------------------------------

followUp:

  # Assessment of treatment response.
  responseAssessment: []

  # Evaluation after completion of treatment.
  postTreatmentEvaluation: []

  # Long-term surveillance plan.
  surveillance: []

  # Other follow-up considerations.
  other: []


# ----------------------------------------------------------------------------
# References
# ----------------------------------------------------------------------------

references: []


# ----------------------------------------------------------------------------
# Review
# ----------------------------------------------------------------------------

review:

  lastReviewed:

  reviewedBy: