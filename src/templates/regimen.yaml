# ============================================================================
# Regimen Template
#
# Purpose:
# Structured representation of an oncology treatment regimen.
#
# Notes:
# - Use identifiers for linked entities.
# - Keep clinical statements traceable to references.
# - Empty lists are preferred over unsupported assumptions.
# - A regimen may be standalone or composite.
# ============================================================================

# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

id:

title:

description:

aliases: []

# Regimen type:
#
# standalone = independently administered regimen/protocol
# composite  = regimen composed of two or more reusable regimens
#
# Examples:
# - AC: standalone
# - Weekly Paclitaxel: standalone
# - AC-T: composite

type: standalone

# ----------------------------------------------------------------------------
# Clinical Context
# ----------------------------------------------------------------------------

# Related disease identifiers.

diseases: []

# Treatment intent:
#
# curative
# palliative

treatmentIntent: []

# Clinical setting:
#
# adjuvant
# neoadjuvant
# metastatic
# induction
# consolidation
# maintenance
# definitive
# other

setting: []

# Line of therapy:
#
# first-line
# second-line
# third-line
# later-line

lineOfTherapy: []

# Biomarkers relevant to treatment selection.

biomarkers: []

# ----------------------------------------------------------------------------
# Eligibility
# ----------------------------------------------------------------------------

eligibility: []

# ----------------------------------------------------------------------------
# Schedule
# ----------------------------------------------------------------------------

schedule:

  cycle:
    length:
      value:
      unit: days

  stopCondition:
    plannedCycles:

  # Optional alternatives for regimens without a fixed number of cycles.

  # duration:
  #   value:
  #   unit: weeks

  # untilProgression:

  # untilUnacceptableToxicity:

  treatmentPhases: []

# ----------------------------------------------------------------------------
# Pre-treatment Assessment
# ----------------------------------------------------------------------------

preTreatmentAssessment:

  # Confirm diagnosis and required disease characteristics.

  diagnosis: []

  # Clinical evaluation before starting treatment.

  clinical: []

  # Baseline laboratory investigations.

  laboratory: []

  # Infection screening required before treatment.

  infectionScreening: []

  # Baseline imaging or functional studies.

  imaging: []

  # Required calculations (e.g., BSA).

  calculations: []

  # Patient education and consent.

  counselling: []

  # Other pre-treatment assessments.

  other: []

# ----------------------------------------------------------------------------
# Treatment Preparation
# ----------------------------------------------------------------------------

treatmentPreparation:

  # Medications administered immediately before treatment.

  premedications: []

  # Antiemetic prophylaxis.

  antiemetics:

    # Expected chemotherapy-induced nausea/vomiting risk.
    #
    # Options:
    # minimal
    # low
    # moderate
    # high

    risk:

    # Specific antiemetic medications used for this regimen.

    medications:

      - drug:

        dose:
          value:
          unit:
          type:

        administration:
          route:
          timing:
          notes:

  # Hydration before or during treatment.

  hydration: []

  # Prophylactic measures
  # (e.g., antiviral, TLS prophylaxis).

  prophylaxis: []

  # Other preparation steps.

  other: []

# ----------------------------------------------------------------------------
# Standalone Regimen: Medications
# ----------------------------------------------------------------------------
#
# Used only when type: standalone
#
# Medications should follow administration order.
#
# Each medication contains:
# - drug: linked drug identifier
# - rules: one or more dose/administration rules
#
# Each rule contains:
# - condition: optional conditions such as cycle range
# - dose
# - administration
# - notes: optional rule-specific information
#
# Administration fields:
# - route: IV, PO, SC, IM, or IT
# - administrationDays: treatment day(s)
# - diluent: optional
# - volume: optional
# - infusionDuration: optional
# - notes: optional administration-specific information
#
# Medication-level fields:
# - preparationNotes
# - infusionNotes
# - monitoringNotes
# - comments
# - references

medications:

  - drug: example-drug

    rules:

      - condition:

          cycleRange:
            start:
            end:

        dose:
          value:
          unit:
          type:

        administration:
          route: IV
          administrationDays:
            - 1
          diluent:
          volume:
            value:
            unit:
          infusionDuration:
          notes:

        notes:

    preparationNotes:

    infusionNotes:

    monitoringNotes:

    comments:

    references: []

# ----------------------------------------------------------------------------
# Composite Regimen: Components
# ----------------------------------------------------------------------------
#
# Used only when type: composite.
#
# Components reference reusable regimen entities.
#
# Example:
#
# components:
#   - regimen: ac
#     cycleRange:
#       start: 1
#       end: 4
#     notes: Doxorubicin and cyclophosphamide every 21 days.
#
#   - regimen: paclitaxel-weekly
#     cycleRange:
#       start: 5
#       end: 16
#     notes: Paclitaxel 80 mg/m² weekly for 12 cycles.

components:

  - regimen:

    cycleRange:
      start:
      end:

    notes:

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  beforeEachCycle: []

  duringTreatment: []

# ----------------------------------------------------------------------------
# Supportive Care
# ----------------------------------------------------------------------------

# Use supportive-care identifiers when available.

supportiveCare: []

# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications: []

# ----------------------------------------------------------------------------
# Follow-up
# ----------------------------------------------------------------------------

followUp:

  # Assessment of treatment response.

  responseAssessment: []

  # Evaluation after completion of treatment.

  postTreatmentEvaluation: []

  # Long-term surveillance plan.

  surveillance: []

  # Other follow-up considerations.

  other: []

# ----------------------------------------------------------------------------
# References
# ----------------------------------------------------------------------------

references: []

# ----------------------------------------------------------------------------
# Review
# ----------------------------------------------------------------------------

review:

  lastReviewed:

  reviewedBy:

  # Optional.

  nextReview: