# ============================================================================
# Regimen Template
#
# Purpose:
# Structured representation of an oncology treatment regimen.
#
# Notes:
# - Use identifiers for linked entities.
# - Keep clinical statements traceable to references.
# - Empty lists are preferred over unsupported assumptions.
#
# ============================================================================

# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

id:

title:

aliases: []

# ----------------------------------------------------------------------------
# Clinical Context
# ----------------------------------------------------------------------------

# Related disease identifiers.
diseases: []

# Treatment intent:
# curative
# adjuvant
# neoadjuvant
# definitive
# maintenance
# palliative
intent:

# Clinical setting.
setting:

# Line of therapy:
# first-line
# second-line
# third-line
# later-line
lineOfTherapy:

# Biomarkers relevant to treatment selection.
biomarkers: []

# ----------------------------------------------------------------------------
# Eligibility
# ----------------------------------------------------------------------------

eligibility: []

# ----------------------------------------------------------------------------
# Schedule
# ----------------------------------------------------------------------------

schedule:

  cycle:
    length:
      value:
      unit: days

  stopCondition:
    plannedCycles:

    duration:
      value:
      unit: weeks

    untilProgression:

    untilUnacceptableToxicity:

  treatmentPhases: []

# ----------------------------------------------------------------------------
# Pre-treatment Assessment
# ----------------------------------------------------------------------------

preTreatmentAssessment:

  # Confirm diagnosis and required disease characteristics.
  diagnosis: []

  # Clinical evaluation before starting treatment.
  clinical: []

  # Baseline laboratory investigations.
  laboratory: []

  # Infection screening required before treatment.
  infectionScreening: []

  # Baseline imaging or functional studies.
  imaging: []

  # Required calculations (e.g., BSA).
  calculations: []

  # Patient education and consent.
  counselling: []

  # Other pre-treatment assessments.
  other: []

# ----------------------------------------------------------------------------
# Treatment Preparation
# ----------------------------------------------------------------------------

treatmentPreparation:

# Medications administered immediately before treatment.
premedications: []

# Antiemetic prophylaxis.
antiemetics:

  # Expected chemotherapy-induced nausea/vomiting risk.
  #
  # Options:
  # minimal
  # low
  # moderate
  # high
  risk:

  # Specific antiemetic medications used for this regimen.
  medications:

  - drug:

    dose:
      value:
      unit:
      type:

    administration:
      route:
      timing:
      notes:

# Hydration before or during treatment.
hydration: []

# Prophylactic measures (e.g., antiviral, TLS prophylaxis).
prophylaxis: []

# Other preparation steps.
other: []

# ----------------------------------------------------------------------------
# Medications
# ----------------------------------------------------------------------------

# Medications should follow administration order.
#
# Each medication contains:
# - drug: linked drug identifier
# - rules: one or more dose/administration rules
#
# Each rule contains:
# - condition: optional conditions such as cycle range
# - dose
# - administration
# - notes: optional rule-specific information
#
# Administration fields:
# - route: IV, PO, SC, IM, or IT
# - administrationDays: treatment day(s)
# - diluent: optional
# - volume: optional
# - infusionDuration: optional
# - notes: optional administration-specific information
#
# Medication-level fields:
# - preparationNotes
# - infusionNotes
# - monitoringNotes
# - comments

medications:

  - drug: example-drug

    rules:

      - condition:
          cycleRange:
            start:
            end:

        dose:
          value:
          unit:
          type:

        administration:
          route: IV
          administrationDays:
            - 1
          diluent:
          volume:
            value:
            unit:
          infusionDuration:
          notes:

        notes:

    preparationNotes:

    infusionNotes:

    monitoringNotes:

    comments:

    references: []

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------

monitoring:

  beforeEachCycle: []

  duringTreatment: []

# ----------------------------------------------------------------------------
# Supportive Care
# ----------------------------------------------------------------------------

# Use supportive-care identifiers when available.
supportiveCare: []

# ----------------------------------------------------------------------------
# Dose Modifications
# ----------------------------------------------------------------------------

doseModifications: []

# ----------------------------------------------------------------------------
# Follow-up
# ----------------------------------------------------------------------------

followUp:

  # Assessment of treatment response.
  responseAssessment: []

  # Evaluation after completion of treatment.
  postTreatmentEvaluation: []

  # Long-term surveillance plan.
  surveillance: []

  # Other follow-up considerations.
  other: []

# ----------------------------------------------------------------------------
# References
# ----------------------------------------------------------------------------

references: []

# ----------------------------------------------------------------------------
# Review
# ----------------------------------------------------------------------------

review:

  lastReviewed:

  reviewedBy:

  # Optional.
  nextReview:

